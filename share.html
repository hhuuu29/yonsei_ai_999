<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body class="share-page">

  </main>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="google-calendar.js"></script><script src="snapshot.js"></script>
  <script src="cloud-client.js"></script><script src="share.js"></script>
