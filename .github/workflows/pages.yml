name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify existing features
        run: node --test tests/*.test.js
      - name: Stage static app (no build required)
        run: |
          mkdir -p _site/data
          cp index.html app.css llm-extractor.js chat-assistant.js google-calendar.js ui.js _site/
          cp data/trainthon-pc.txt data/trainthon-mobile.txt data/meeting-sample.txt _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
