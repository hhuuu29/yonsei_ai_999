<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#e8f0f4" media="(prefers-color-scheme: light)" />
  <title>톡일정 — 카카오톡 → .ics</title>
  <style>
    :root {
      --bg0: #e8f0f4;
      --bg1: #f4f8fa;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-solid: #ffffff;
      --ink: #12202a;
      --muted: #4a6170;
      --line: rgba(18, 32, 42, 0.12);
      --accent: #0f7a6c;
      --accent-hover: #0b6358;
      --warn: #9a5b00;
      --warn-bg: rgba(154, 91, 0, 0.1);
      --danger: #b42318;
      --shadow: 0 12px 40px rgba(18, 32, 42, 0.1);
      --radius: 16px;
      --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
      --mono: "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg0: #0f1720;
        --bg1: #15212c;
        --surface: rgba(28, 40, 52, 0.88);
        --surface-solid: #1c2834;
        --ink: #e8f0f4;
        --muted: #9bb0bd;
        --line: rgba(232, 240, 244, 0.12);
        --accent: #3dbead;
        --accent-hover: #5ed0c0;
        --warn: #f0b429;
        --warn-bg: rgba(240, 180, 41, 0.12);
        --danger: #ff7b72;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 0% 0%, rgba(15, 122, 108, 0.14), transparent 55%),
        radial-gradient(700px 420px at 100% 10%, rgba(61, 110, 160, 0.12), transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      background-attachment: fixed;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 1rem 1rem 5.5rem;
    }

    header {
      padding: 0.75rem 0 1rem;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    header p {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    #chatInput {
      display: block;
      width: 100%;
      min-height: 42vh;
      max-height: 70vh;
      padding: 1rem;
      border: 0;
      resize: vertical;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.98rem;
      line-height: 1.55;
      outline: none;
    }
    #chatInput::placeholder { color: var(--muted); opacity: 0.8; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      padding: 0.75rem;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 0.78rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      color: #06221e;
    }
    @media (prefers-color-scheme: light) {
      .btn-primary { color: #fff; }
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-file {
      position: relative;
      overflow: hidden;
    }
    .btn-file input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .status {
      min-height: 1.25rem;
      margin: 0.7rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .status.ok { color: var(--accent); }
    .status.warn { color: var(--warn); }
    .status.err { color: var(--danger); }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 1.5rem 0 0.75rem;
    }
    .section-title h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .section-title span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .cards {
      display: grid;
      gap: 0.75rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem 0.9rem;
      box-shadow: var(--shadow);
    }
    .card.unchecked { opacity: 0.55; }
    .card-top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem;
      align-items: start;
    }
    .card input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      margin-top: 0.35rem;
      accent-color: var(--accent);
    }
    .fields {
      display: grid;
      gap: 0.45rem;
      min-width: 0;
    }
    .field {
      display: grid;
      gap: 0.15rem;
    }
    .field label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      background: var(--surface-solid);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
    }
    .field input:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
    }
    @media (max-width: 420px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .meta {
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px dashed var(--line);
      font-size: 0.82rem;
      color: var(--muted);
      word-break: break-word;
    }
    .meta strong {
      color: var(--ink);
      font-weight: 650;
    }
    .warn-banner {
      display: none;
      margin: 0 0 0.75rem;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    }
    .warn-banner.show { display: block; }
    .empty {
      padding: 1.25rem 1rem;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    .export-bar {
      position: sticky;
      bottom: 0;
      z-index: 5;
      margin: 1rem -1rem -1rem;
      padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg1) 82%, transparent);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .export-bar .btn {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      font-size: 1rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>톡일정</h1>
      <p>카카오톡 대화보내기 텍스트에서 일정을 찾아 .ics로 저장합니다. 완전 오프라인.</p>
    </header>

    <section class="panel" aria-label="대화 입력">
      <label class="sr-only" for="chatInput">카카오톡 대화 텍스트</label>
      <textarea
        id="chatInput"
        spellcheck="false"
        placeholder="카카오톡 ‘대화 내용 내보내기’ .txt를 붙여넣거나 업로드하세요.

예)
--------------- 2026년 9월 9일 수요일 ---------------
2026. 9. 9. 오전 8:13, 홍길동 : 내일 오후 3시 강릉역에서 만나자
[김연세] [오후 2:05] 9/12(토) 저녁 7시 회의실 3층"
      ></textarea>
      <div class="row">
        <label class="btn btn-secondary btn-file">
          .txt 업로드
          <input id="fileInput" type="file" accept=".txt,text/plain" />
        </label>
        <button type="button" class="btn btn-secondary" id="btnClear">비우기</button>
        <button type="button" class="btn btn-primary" id="btnFind">일정 찾기</button>
      </div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="section-title">
      <h2>추출된 일정</h2>
      <span id="countLabel">0개</span>
    </div>
    <div id="tooManyWarn" class="warn-banner" role="status"></div>
    <div id="cards" class="cards" aria-live="polite">
      <div class="empty">아직 추출된 일정이 없습니다.</div>
    </div>

    <div class="export-bar">
      <button type="button" class="btn btn-primary" id="btnExport" disabled>
        선택한 일정 .ics로 내보내기
      </button>
    </div>
  </div>

  <script>
(function () {
  "use strict";

  /* ========================================================================
   * Pure helpers — KakaoTalk parse + schedule extract + ICS
   * ======================================================================== */

  var WEEKDAY_KO = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
  var WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
  var IGNORE_LINE_RE = /(님이\s*(들어왔습니다|나갔습니다)|^(사진|동영상|파일|이모티콘|음성메시지|삭제된\s*메시지)$|메시지가\s*삭제되었습니다|톡게시판|'.*'님이)/;

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function cloneDate(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
  }

  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function addDays(d, n) {
    var x = startOfDay(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  function escapeIcsText(value) {
    return String(value == null ? "" : value)
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\r\n|\n|\r/g, "\\n");
  }

  function foldIcsLine(line) {
    var max = 75;
    if (line.length <= max) return line;
    var out = "";
    var rest = line;
    while (rest.length > max) {
      out += rest.slice(0, max) + "\r\n ";
      rest = rest.slice(max);
    }
    return out + rest;
  }

  function formatIcsLocal(dt) {
    return (
      dt.getFullYear() +
      pad2(dt.getMonth() + 1) +
      pad2(dt.getDate()) +
      "T" +
      pad2(dt.getHours()) +
      pad2(dt.getMinutes()) +
      pad2(dt.getSeconds())
    );
  }

  function formatIcsDate(dt) {
    return dt.getFullYear() + pad2(dt.getMonth() + 1) + pad2(dt.getDate());
  }

  function formatIcsUtcStamp(dt) {
    return (
      dt.getUTCFullYear() +
      pad2(dt.getUTCMonth() + 1) +
      pad2(dt.getUTCDate()) +
      "T" +
      pad2(dt.getUTCHours()) +
      pad2(dt.getUTCMinutes()) +
      pad2(dt.getUTCSeconds()) +
      "Z"
    );
  }

  function makeUid(event, index) {
    var stamp = event.start ? formatIcsLocal(event.start) : "nodate";
    var slug = String(event.title || "event")
      .toLowerCase()
      .replace(/[^a-z0-9가-힣]+/gi, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 36);
    return "talkcal-" + stamp + "-" + index + "-" + slug + "@talkcal.local";
  }

  /**
   * @param {Array} events
   * @param {{ now?: Date, calendarName?: string }} [options]
   */
  function eventsToIcs(events, options) {
    options = options || {};
    var now = options.now instanceof Date ? options.now : new Date();
    var calendarName = options.calendarName || "톡일정";
    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//TalkCal//KO",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "X-WR-CALNAME:" + escapeIcsText(calendarName),
      "X-WR-TIMEZONE:Asia/Seoul",
      "BEGIN:VTIMEZONE",
      "TZID:Asia/Seoul",
      "X-LIC-LOCATION:Asia/Seoul",
      "BEGIN:STANDARD",
      "TZOFFSETFROM:+0900",
      "TZOFFSETTO:+0900",
      "TZNAME:KST",
      "DTSTART:19700101T000000",
      "END:STANDARD",
      "END:VTIMEZONE"
    ];

    (events || []).forEach(function (ev, i) {
      if (!ev || !(ev.start instanceof Date) || isNaN(ev.start.getTime())) return;
      var end = ev.end instanceof Date && !isNaN(ev.end.getTime())
        ? ev.end
        : new Date(ev.start.getTime() + 60 * 60 * 1000);
      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + (ev.uid || makeUid(ev, i)));
      lines.push("DTSTAMP:" + formatIcsUtcStamp(now));
      if (ev.allDay) {
        var dayEnd = startOfDay(end);
        if (dayEnd.getTime() <= startOfDay(ev.start).getTime()) {
          dayEnd = addDays(ev.start, 1);
        }
        lines.push("DTSTART;VALUE=DATE:" + formatIcsDate(ev.start));
        lines.push("DTEND;VALUE=DATE:" + formatIcsDate(dayEnd));
      } else {
        lines.push("DTSTART;TZID=Asia/Seoul:" + formatIcsLocal(ev.start));
        lines.push("DTEND;TZID=Asia/Seoul:" + formatIcsLocal(end));
      }
      lines.push("SUMMARY:" + escapeIcsText(ev.title || "일정"));
      if (ev.location) lines.push("LOCATION:" + escapeIcsText(ev.location));
      if (ev.description) lines.push("DESCRIPTION:" + escapeIcsText(ev.description));
      lines.push("END:VEVENT");
    });

    lines.push("END:VCALENDAR");
    return lines.map(foldIcsLine).join("\r\n") + "\r\n";
  }

  /* ---------- KakaoTalk export → messages ---------- */

  var DATE_SEP_RE = /^-*\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일(?:\s*([월화수목금토일])요일)?\s*-*$/;
  var MSG_A_RE = /^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*(.+?)\s*:\s*(.*)$/;
  var MSG_B_RE = /^\[([^\]]+)\]\s*\[(오전|오후)\s*(\d{1,2}):(\d{2})\]\s*(.*)$/;

  function parseKakaoMessages(text) {
    var lines = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    var messages = [];
    var currentDate = null;
    var current = null;

    function pushCurrent() {
      if (current) {
        current.text = String(current.text || "").replace(/\s+$/, "");
        if (current.text && !IGNORE_LINE_RE.test(current.text)) {
          messages.push(current);
        }
      }
      current = null;
    }

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.replace(/^\uFEFF/, "");
      var trimmed = line.trim();

      if (!trimmed) {
        if (current) current.text += "\n";
        continue;
      }

      if (IGNORE_LINE_RE.test(trimmed) && !MSG_A_RE.test(trimmed) && !MSG_B_RE.test(trimmed)) {
        pushCurrent();
        continue;
      }

      var sep = trimmed.match(DATE_SEP_RE);
      if (sep) {
        pushCurrent();
        currentDate = new Date(Number(sep[1]), Number(sep[2]) - 1, Number(sep[3]));
        continue;
      }

      var a = trimmed.match(MSG_A_RE);
      if (a) {
        pushCurrent();
        var hourA = Number(a[5]);
        if (a[4] === "오후" && hourA < 12) hourA += 12;
        if (a[4] === "오전" && hourA === 12) hourA = 0;
        currentDate = new Date(Number(a[1]), Number(a[2]) - 1, Number(a[3]));
        current = {
          speaker: a[7].trim(),
          sentAt: new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), hourA, Number(a[6]), 0, 0),
          date: startOfDay(currentDate),
          text: a[8] || ""
        };
        continue;
      }

      var b = trimmed.match(MSG_B_RE);
      if (b) {
        pushCurrent();
        var hourB = Number(b[3]);
        if (b[2] === "오후" && hourB < 12) hourB += 12;
        if (b[2] === "오전" && hourB === 12) hourB = 0;
        var base = currentDate ? startOfDay(currentDate) : startOfDay(new Date());
        current = {
          speaker: b[1].trim(),
          sentAt: new Date(base.getFullYear(), base.getMonth(), base.getDate(), hourB, Number(b[4]), 0, 0),
          date: base,
          text: b[5] || ""
        };
        continue;
      }

      // Continuation / unknown line → append to previous message
      if (current) {
        current.text += (current.text ? "\n" : "") + line;
      }
    }

    pushCurrent();
    return messages;
  }

  /* ---------- Schedule extraction from message text ---------- */

  function parseClock(ampm, h, m, approx) {
    var hour = Number(h);
    var min = m == null || m === "" ? 0 : Number(m);
    if (isNaN(hour) || isNaN(min)) return null;
    var label = String(ampm || "");
    if (/저녁|밤|오후/.test(label) && hour < 12) hour += 12;
    if (/오전|아침/.test(label) && hour === 12) hour = 0;
    if (/저녁/.test(label) && hour < 12) hour += 12;
    if (hour > 23 || min > 59) return null;
    return { h: hour, m: min, approx: !!approx };
  }

  function findTime(text) {
    // Prefer Korean clock phrases (supports "오전 8시 30분까지")
    var patterns = [
      /(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시\s*(\d{1,2})\s*분(?:\s*(?:까지|경))?/,
      /(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*:\s*(\d{2})(?:\s*(?:까지|경))?/,
      /(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시(?:\s*(?:까지|경))?/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = text.match(patterns[i]);
      if (!m) continue;
      var clock;
      if (i === 2) clock = parseClock(m[1], m[2], 0, /경/.test(m[0]));
      else clock = parseClock(m[1], m[2], m[3], /경/.test(m[0]));
      if (!clock) continue;
      return { clock: clock, match: m[0], index: m.index };
    }
    // 24h "15:37" — require 2-digit minutes so "1:1 멘토링" is not a time
    var mil = text.match(/(?:^|[^\d])([01]?\d|2[0-3]):([0-5]\d)(?:\s*(?:까지|경))?(?!\d)/);
    if (mil) {
      var idx = mil.index + (mil[0].match(/^\d/) ? 0 : 1);
      var matched = text.slice(idx).match(/^([01]?\d|2[0-3]):([0-5]\d)(?:\s*(?:까지|경))?/);
      if (matched) {
        return {
          clock: { h: Number(matched[1]), m: Number(matched[2]), approx: /경/.test(matched[0]) },
          match: matched[0],
          index: idx
        };
      }
    }
    return null;
  }

  function mondayOfWeek(ref) {
    var base = startOfDay(ref);
    var cur = base.getDay(); // 0=Sun
    return addDays(base, cur === 0 ? -6 : 1 - cur);
  }

  function dateOnWeek(monday, targetDow) {
    if (targetDow === 0) return addDays(monday, 6); // Sunday
    return addDays(monday, targetDow - 1);
  }

  function nextWeekday(ref, targetDow, weekOffset) {
    // weekOffset 0 = this week (Mon–Sun), 1 = next week
    var monday = mondayOfWeek(ref);
    if (weekOffset === 1) monday = addDays(monday, 7);
    return dateOnWeek(monday, targetDow);
  }

  function extractDate(text, refDate) {
    var warnings = [];
    var ref = startOfDay(refDate || new Date());
    var work = text;
    var result = null;

    // 다음주 / 이번주 + weekday
    var week = work.match(/(다음\s*주|이번\s*주)\s*([월화수목금토일])(?:요일)?/);
    if (week) {
      var dow = WEEKDAY_KO[week[2]];
      var offset = /다음/.test(week[1]) ? 1 : 0;
      result = {
        date: nextWeekday(ref, dow, offset),
        match: week[0],
        index: week.index
      };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, week.index, week[0].length) };
    }

    if (/(내일)/.test(work)) {
      var t = work.match(/내일/);
      result = { date: addDays(ref, 1), match: t[0], index: t.index };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, t.index, t[0].length) };
    }
    if (/(모레)/.test(work)) {
      var mr = work.match(/모레/);
      result = { date: addDays(ref, 2), match: mr[0], index: mr.index };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, mr.index, mr[0].length) };
    }
    if (/(오늘)/.test(work)) {
      var td = work.match(/오늘/);
      result = { date: ref, match: td[0], index: td.index };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, td.index, td[0].length) };
    }

    // 9/9(수) or 9월 9일(수) or 2026년 9월 9일
    var abs = work.match(/(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일(?:\s*\(([월화수목금토일])\))?/);
    if (!abs) abs = work.match(/(?:(\d{4})[.\-\/])?(\d{1,2})\s*[./\-]\s*(\d{1,2})(?:\s*\(([월화수목금토일])\))?/);

    if (abs) {
      var year = abs[1] ? Number(abs[1]) : ref.getFullYear();
      var month = Number(abs[2]) - 1;
      var day = Number(abs[3]);
      var date = new Date(year, month, day);
      if (date.getMonth() !== month || date.getDate() !== day) {
        return { dateInfo: null, warnings: warnings, rest: work };
      }
      // If no year and date is > 6 months behind ref, bump year
      if (!abs[1]) {
        var tmp = new Date(year, month, day);
        var diff = (tmp - ref) / (86400000);
        if (diff < -180) date = new Date(year + 1, month, day);
      }
      if (abs[4]) {
        var expected = WEEKDAY_KO[abs[4]];
        if (expected != null && date.getDay() !== expected) {
          warnings.push(
            "날짜와 요일이 맞지 않습니다: " + abs[0] +
            " → 실제 " + WEEKDAY_NAMES[date.getDay()] + "요일 (날짜 우선)"
          );
        }
      }
      result = { date: startOfDay(date), match: abs[0], index: abs.index };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, abs.index, abs[0].length) };
    }

    // Bare weekday: "목요일 15:37" → upcoming that weekday from message date (today inclusive)
    var bareWd = work.match(/([월화수목금토일])요일/);
    if (bareWd) {
      var target = WEEKDAY_KO[bareWd[1]];
      var cur = ref.getDay();
      var delta = (target - cur + 7) % 7;
      result = {
        date: addDays(ref, delta),
        match: bareWd[0],
        index: bareWd.index
      };
      return { dateInfo: result, warnings: warnings, rest: stripOnce(work, bareWd.index, bareWd[0].length) };
    }

    return { dateInfo: null, warnings: warnings, rest: work };
  }

  function stripOnce(text, index, len) {
    return (text.slice(0, index) + " " + text.slice(index + len)).replace(/\s{2,}/g, " ").trim();
  }

  /** Remove matched spans by index only (no global word scrubbing). Pure. */
  function cutMatchedSpans(text, spans) {
    var sorted = (spans || [])
      .filter(function (s) {
        return s && typeof s.index === "number" && s.length > 0 && s.index >= 0;
      })
      .slice()
      .sort(function (a, b) { return b.index - a.index; });
    var out = String(text || "");
    sorted.forEach(function (s) {
      out = out.slice(0, s.index) + out.slice(s.index + s.length);
    });
    return out.replace(/[ \t]{2,}/g, " ").replace(/\s+\n/g, "\n").trim();
  }

  /**
   * Clear-time events first (by datetime), then all-day (by date).
   * "날짜순" within each group + timed events on top.
   */
  function sortEventsTimedFirst(events) {
    return (events || []).slice().sort(function (a, b) {
      var aTimed = a.allDay ? 1 : 0;
      var bTimed = b.allDay ? 1 : 0;
      if (aTimed !== bTimed) return aTimed - bTimed;
      return a.start.getTime() - b.start.getTime();
    });
  }

  function extractLocation(text) {
    var m = text.match(/([가-힣A-Za-z0-9]*?(?:역|홀|센터|카페|회의실|강의실|도서관|식당|공원|캠퍼스|빌딩|타워))\s*(\d+\s*층)?/);
    if (m) {
      return {
        location: (m[1] + (m[2] ? " " + m[2] : "")).replace(/\s+/g, " ").trim(),
        match: m[0]
      };
    }
    m = text.match(/(\d+\s*층)/);
    if (m) return { location: m[1].trim(), match: m[0] };
    m = text.match(/([가-힣A-Za-z0-9]{2,20})\s*에서/);
    if (m) return { location: m[1].trim(), match: m[0] };
    return { location: "", match: "" };
  }

  function summarizeTitle(text) {
    var t = String(text || "")
      .replace(/\s+/g, " ")
      .trim();
    if (!t) return "일정";
    if (t.length <= 40) return t;
    return t.slice(0, 40).trim();
  }

  function messageHasScheduleCue(text) {
    return /(?:\d{1,2}\s*[./월]\s*\d{1,2}|\d{1,2}\s*월\s*\d{1,2}\s*일|내일|모레|오늘|다음\s*주|이번\s*주|[월화수목금토일]요일|\d{1,2}\s*시|\d{1,2}\s*:\s*\d{2}|오전|오후|아침|저녁|밤)/.test(text);
  }

  /**
   * Extract a single event from one schedule line/snippet. Pure.
   * Title keeps leftover text; only matched date/time(/location) spans are cut by index.
   * @returns {object|null}
   */
  function extractEventFromLine(line, msg) {
    var text = String(line || "").trim();
    if (!text || !messageHasScheduleCue(text)) return null;

    var dateRes = extractDate(text, msg.date || msg.sentAt || new Date());
    // Time from the original line so match indices stay aligned with `text`
    var timeRes = findTime(text);
    // Prefer time that sits outside the date match when both overlap oddly
    if (timeRes && dateRes.dateInfo) {
      var d0 = dateRes.dateInfo.index;
      var d1 = d0 + dateRes.dateInfo.match.length;
      if (timeRes.index >= d0 && timeRes.index < d1) {
        timeRes = findTime(dateRes.rest);
        if (timeRes) {
          // remap index from `rest` back to approximate cut on original via search
          var rel = text.indexOf(timeRes.match);
          if (rel >= 0) timeRes = { clock: timeRes.clock, match: timeRes.match, index: rel };
          else timeRes = null;
        }
      }
    }

    if (!dateRes.dateInfo && !timeRes) return null;

    var eventDate = dateRes.dateInfo
      ? dateRes.dateInfo.date
      : startOfDay(msg.date || msg.sentAt || new Date());

    var spans = [];
    if (dateRes.dateInfo) {
      spans.push({ index: dateRes.dateInfo.index, length: dateRes.dateInfo.match.length });
    }
    if (timeRes) {
      spans.push({ index: timeRes.index, length: timeRes.match.length });
    }

    var work = cutMatchedSpans(text, spans);
    var loc = extractLocation(work);
    var workBeforeLoc = work;
    if (loc.match) {
      var locAt = work.indexOf(loc.match);
      if (locAt >= 0) {
        work = cutMatchedSpans(work, [{ index: locAt, length: loc.match.length }]);
      }
    }

    var title = summarizeTitle(work.split("\n")[0] || work);
    if (!title || title === "일정") {
      title = summarizeTitle(workBeforeLoc.split("\n")[0] || workBeforeLoc || loc.location || "일정");
    }

    var allDay = !timeRes;
    var start;
    var end;
    if (allDay) {
      if (!dateRes.dateInfo) return null;
      start = startOfDay(eventDate);
      end = addDays(eventDate, 1);
    } else {
      start = new Date(
        eventDate.getFullYear(),
        eventDate.getMonth(),
        eventDate.getDate(),
        timeRes.clock.h,
        timeRes.clock.m,
        0,
        0
      );
      end = new Date(start.getTime() + 60 * 60 * 1000);
    }

    return {
      title: title,
      start: start,
      end: end,
      allDay: allDay,
      hasClearTime: !allDay,
      location: loc.location || "",
      description: (msg.speaker ? msg.speaker + ": " : "") + text,
      sourceText: text,
      speaker: msg.speaker || "",
      warnings: dateRes.warnings || [],
      selected: true
    };
  }

  /**
   * One Kakao message may contain multiple schedule lines. Pure.
   * @returns {object[]}
   */
  function extractEventsFromMessage(msg) {
    var full = String(msg.text || "").trim();
    if (!full) return [];

    var lines = full.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var found = [];
    var seen = {};

    function pushEv(ev) {
      if (!ev || !(ev.start instanceof Date) || isNaN(ev.start.getTime())) return;
      var key = ev.start.getTime() + "|" + ev.title + "|" + (ev.location || "");
      if (seen[key]) return;
      seen[key] = true;
      found.push(ev);
    }

    lines.forEach(function (line) {
      pushEv(extractEventFromLine(line, msg));
    });

    // Fallback: whole message as one blob (single-line exports)
    if (!found.length) {
      pushEv(extractEventFromLine(full, msg));
    }

    return found;
  }

  /** @deprecated use extractEventsFromMessage — kept for Phase 2 compat */
  function extractEventFromMessage(msg) {
    var list = extractEventsFromMessage(msg);
    return list.length ? list[0] : null;
  }

  function parseScheduleFromKakao(text) {
    var messages = parseKakaoMessages(text);
    var events = [];
    var warnings = [];
    messages.forEach(function (msg) {
      try {
        var extracted = extractEventsFromMessage(msg);
        extracted.forEach(function (ev) {
          ev.uid = makeUid(ev, events.length);
          events.push(ev);
          if (ev.warnings && ev.warnings.length) {
            warnings = warnings.concat(ev.warnings);
          }
        });
      } catch (err) {
        warnings.push("메시지 처리 중 오류: " + (err && err.message ? err.message : String(err)));
      }
    });
    events = sortEventsTimedFirst(events);
    return { messages: messages, events: events, warnings: warnings };
  }

  /* expose for debugging / Phase 2 */
  window.TalkCal = {
    parseKakaoMessages: parseKakaoMessages,
    parseScheduleFromKakao: parseScheduleFromKakao,
    eventsToIcs: eventsToIcs,
    extractEventFromMessage: extractEventFromMessage,
    extractEventsFromMessage: extractEventsFromMessage,
    sortEventsTimedFirst: sortEventsTimedFirst,
    cutMatchedSpans: cutMatchedSpans
  };

  /* ========================================================================
   * UI
   * ======================================================================== */

  var chatInput = document.getElementById("chatInput");
  var fileInput = document.getElementById("fileInput");
  var btnFind = document.getElementById("btnFind");
  var btnClear = document.getElementById("btnClear");
  var btnExport = document.getElementById("btnExport");
  var cardsEl = document.getElementById("cards");
  var statusEl = document.getElementById("status");
  var countLabel = document.getElementById("countLabel");
  var tooManyWarn = document.getElementById("tooManyWarn");

  /** @type {Array} */
  var stateEvents = [];

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function updateTooManyWarning(count) {
    if (count > 20) {
      tooManyWarn.textContent =
        "추출된 일정이 " + count + "개입니다 (20개 초과). 노이즈가 섞였을 수 있으니 필요한 항목만 선택한 뒤 내보내 주세요. 명확한 시간 일정이 위에 정렬되어 있습니다.";
      tooManyWarn.classList.add("show");
    } else {
      tooManyWarn.textContent = "";
      tooManyWarn.classList.remove("show");
    }
  }

  function selectedEvents() {
    return stateEvents.filter(function (e) { return e.selected; });
  }

  function updateExportEnabled() {
    btnExport.disabled = selectedEvents().length === 0;
    countLabel.textContent = stateEvents.length + "개 · 선택 " + selectedEvents().length;
  }

  function toDateInputValue(d, allDay) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return "";
    return (
      d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())
    );
  }

  function toTimeInputValue(d) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return "";
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function renderCards() {
    cardsEl.innerHTML = "";
    if (!stateEvents.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "아직 추출된 일정이 없습니다.";
      cardsEl.appendChild(empty);
      updateExportEnabled();
      return;
    }

    stateEvents.forEach(function (ev, index) {
      var card = document.createElement("article");
      card.className = "card" + (ev.selected ? "" : " unchecked");

      var top = document.createElement("div");
      top.className = "card-top";

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!ev.selected;
      cb.setAttribute("aria-label", "일정 선택");
      cb.addEventListener("change", function () {
        ev.selected = cb.checked;
        card.classList.toggle("unchecked", !ev.selected);
        updateExportEnabled();
      });

      var fields = document.createElement("div");
      fields.className = "fields";

      function field(labelText, inputEl) {
        var wrap = document.createElement("div");
        wrap.className = "field";
        var lab = document.createElement("label");
        lab.textContent = labelText;
        wrap.appendChild(lab);
        wrap.appendChild(inputEl);
        return wrap;
      }

      var titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.value = ev.title || "";
      titleInput.addEventListener("input", function () {
        ev.title = titleInput.value;
      });

      var dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.value = toDateInputValue(ev.start, ev.allDay);
      dateInput.addEventListener("change", function () {
        var parts = dateInput.value.split("-");
        if (parts.length !== 3) return;
        var y = Number(parts[0]), mo = Number(parts[1]) - 1, da = Number(parts[2]);
        if (ev.allDay) {
          ev.start = new Date(y, mo, da);
          ev.end = addDays(ev.start, 1);
        } else {
          ev.start = new Date(y, mo, da, ev.start.getHours(), ev.start.getMinutes(), 0, 0);
          ev.end = new Date(ev.start.getTime() + 60 * 60 * 1000);
        }
      });

      var timeInput = document.createElement("input");
      timeInput.type = "time";
      timeInput.value = ev.allDay ? "" : toTimeInputValue(ev.start);
      timeInput.addEventListener("change", function () {
        if (!timeInput.value) {
          ev.allDay = true;
          ev.start = startOfDay(ev.start);
          ev.end = addDays(ev.start, 1);
          return;
        }
        var hm = timeInput.value.split(":");
        ev.allDay = false;
        ev.start = new Date(
          ev.start.getFullYear(),
          ev.start.getMonth(),
          ev.start.getDate(),
          Number(hm[0]),
          Number(hm[1]),
          0,
          0
        );
        ev.end = new Date(ev.start.getTime() + 60 * 60 * 1000);
      });

      var locInput = document.createElement("input");
      locInput.type = "text";
      locInput.value = ev.location || "";
      locInput.placeholder = "장소 (선택)";
      locInput.addEventListener("input", function () {
        ev.location = locInput.value;
      });

      fields.appendChild(field("제목", titleInput));
      var g = document.createElement("div");
      g.className = "grid-2";
      g.appendChild(field("날짜", dateInput));
      g.appendChild(field("시간", timeInput));
      fields.appendChild(g);
      fields.appendChild(field("장소", locInput));

      if (ev.warnings && ev.warnings.length) {
        ev.warnings.forEach(function (w) {
          var badge = document.createElement("div");
          badge.className = "warn-badge";
          badge.textContent = w;
          fields.appendChild(badge);
        });
      }

      var meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "<strong>원본</strong> ";
      meta.appendChild(document.createTextNode(ev.sourceText || ev.description || ""));

      top.appendChild(cb);
      top.appendChild(fields);
      card.appendChild(top);
      card.appendChild(meta);
      cardsEl.appendChild(card);
    });

    updateExportEnabled();
  }

  function findSchedules() {
    try {
      var raw = chatInput.value;
      if (!String(raw || "").trim()) {
        stateEvents = [];
        renderCards();
        updateTooManyWarning(0);
        setStatus("대화 텍스트를 붙여넣거나 .txt를 업로드해 주세요.", "warn");
        return;
      }
      var result = parseScheduleFromKakao(raw);
      stateEvents = result.events;
      renderCards();
      updateTooManyWarning(stateEvents.length);
      if (!result.events.length) {
        setStatus(
          "메시지를 " + result.messages.length + "개 읽었지만 일정을 찾지 못했습니다.",
          "warn"
        );
      } else {
        var warnExtra = result.warnings.length ? " · 경고 " + result.warnings.length + "건" : "";
        var many = result.events.length > 20 ? " · 20개 초과" : "";
        setStatus(
          "메시지 " + result.messages.length + "개 중 일정 " + result.events.length + "개 추출" + many + warnExtra,
          (result.warnings.length || result.events.length > 20) ? "warn" : "ok"
        );
      }
    } catch (err) {
      stateEvents = [];
      renderCards();
      updateTooManyWarning(0);
      setStatus("파싱 중 오류가 발생했습니다: " + (err && err.message ? err.message : err), "err");
    }
  }

  function exportIcs() {
    try {
      var picked = selectedEvents();
      if (!picked.length) return;
      var ics = eventsToIcs(picked, { calendarName: "톡일정" });
      var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "talkcal-" + formatIcsDate(new Date()) + ".ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      setStatus(picked.length + "개 일정을 .ics로 저장했습니다.", "ok");
    } catch (err) {
      setStatus("내보내기 실패: " + (err && err.message ? err.message : err), "err");
    }
  }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        chatInput.value = String(reader.result || "");
        setStatus(file.name + " 불러옴 · " + chatInput.value.length + "자", "ok");
        findSchedules();
      } catch (err) {
        setStatus("파일 읽기 실패: " + (err && err.message ? err.message : err), "err");
      }
    };
    reader.onerror = function () {
      setStatus("파일을 읽을 수 없습니다.", "err");
    };
    reader.readAsText(file, "UTF-8");
    fileInput.value = "";
  });

  btnFind.addEventListener("click", findSchedules);
  btnExport.addEventListener("click", exportIcs);
  btnClear.addEventListener("click", function () {
    chatInput.value = "";
    stateEvents = [];
    renderCards();
    updateTooManyWarning(0);
    setStatus("");
    chatInput.focus();
  });

  /* self-check (console) */
  try {
    var sample =
      "--------------- 2026년 9월 9일 수요일 ---------------\n" +
      "2026. 9. 9. 오전 8:13, 홍길동 : 내일 오후 3시 강릉역에서 만나자\n" +
      "추가 안내: 2번 출구\n" +
      "[김연세] [오후 2:05] 9/12(토) 저녁 7시 회의실 3층\n" +
      "홍길동님이 들어왔습니다.\n" +
      "사진\n" +
      "2026. 9. 9. 오후 4:00, 이수 : 9/9(수) 오전 10시 미팅";
    var check = parseScheduleFromKakao(sample);
    var ics = eventsToIcs(check.events);
    console.info(
      "[톡일정] self-check:",
      check.messages.length,
      "msgs,",
      check.events.length,
      "events,",
      (ics.match(/BEGIN:VEVENT/g) || []).length,
      "vevents"
    );
  } catch (e) {
    console.warn("[톡일정] self-check failed", e);
  }
})();
  </script>
</body>
</html>
